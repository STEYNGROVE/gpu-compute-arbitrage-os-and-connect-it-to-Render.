name: CI / Automated Verification Pipeline

on:
  push:
    branches:
      - main
      - feature/security-hardening-v2
      - test/advanced-https-security
      - test/final-network-security

  pull_request:
    branches:
      - main
      - feature/security-hardening-v2

jobs:
  verify:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck & Static Analysis
        run: npm run lint

      - name: Execute Automated Regression Tests
        run: npm test

      - name: Validate supplier billing safety
        run: npm run test:provider-billing

      - name: Secure Feed Regression Tests
        run: NODE_ENV=test npx tsx test/secureFeedIntegrationSuite.ts

      - name: DNS Isolation Tests
        run: NODE_ENV=test npx tsx test/secureFeedDnsIsolationSuite.ts

      - name: HTTPS Transport Security Tests
        run: NODE_ENV=test npx tsx test/secureFeedTransportSuite.ts

      - name: DNS Pinning Security Tests
        run: NODE_ENV=test npx tsx test/secureFeedDnsPinningSuite.ts

      - name: DNS Edge Security Tests
        run: NODE_ENV=test npx tsx test/secureFeedDnsEdgeSuite.ts

      - name: Generate Temporary TLS Test Certificate
        run: |
          mkdir -p test/fixtures/tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout test/fixtures/tls/server.key -out test/fixtures/tls/server.crt -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
      - name: TLS Certificate Security Tests
        run: NODE_ENV=test npx tsx test/secureFeedTlsSuite.ts

      - name: Socket Security Tests
        run: NODE_ENV=test npx tsx test/secureFeedSocketSuite.ts
      - name: Final Network Security Tests
        run: NODE_ENV=test npx tsx test/secureFeedFinalNetworkSuite.ts
      - name: Feed Timeout Security Tests
        run: NODE_ENV=test npx tsx test/secureFeedTimeoutSuite.ts

      - name: Node 24 HTTPS Socket Lookup Tests
        run: NODE_ENV=test npx tsx test/secureFeedNode24LookupSuite.ts

      - name: Node 24 Production DNS Lookup Tests
        run: NODE_ENV=test npx tsx test/secureFeedNode24ProductionSuite.ts

      - name: Phase 6 GPU Evidence and Owner Authentication
        env:
          NODE_ENV: production
          STRICT_AUTH_ENFORCEMENT: 'true'
        run: |
          npx tsx --test \
            server/gpuOfferEvidence.test.ts \
            server/gpuEvidenceIntegration.test.ts \
            server/gpuEvidenceHttp.test.ts \
            server/gpuAuthIsolation.test.ts \
            server/gpuOwnerAuthHttp.test.ts

      - name: Security check
        run: npm run security:check

      - name: TypeScript validation
        run: npm run typecheck

      - name: Compile Production Bundle
        run: npm run build
