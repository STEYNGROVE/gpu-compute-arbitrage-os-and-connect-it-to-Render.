name: CI / Automated Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck & Static Analysis
        run: npm run lint

      - name: Execute Automated Regression & Security Test Suites
        run: npm test

      - name: Secure Feed Regression Tests
        run: NODE_ENV=test npx tsx test/secureFeedIntegrationSuite.ts
        - name: Verify advanced HTTPS security
          run: |
            NODE_ENV=test npx tsx test/secureFeedDnsIsolationSuite.ts
            NODE_ENV=test npx tsx test/secureFeedTransportSuite.ts

      - name: Compile Production Bundle (Client Assets + Bundled Server)
        run: npm run build
